name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint

  protocols-and-package:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install test dependencies
        run: >-
          dnf -y install git gjs python3-gobject gettext dbus-daemon
          glibc-langpack-en glibc-langpack-pt glibc-langpack-es glibc-langpack-fr
          glibc-langpack-de glibc-langpack-it glibc-langpack-ja
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Python syntax
        run: python3 -m compileall -q broker fixtures tests tools
      - run: dbus-run-session -- python3 tests/run-integration.py
      - run: dbus-run-session -- python3 tests/run-i18n.py
      - run: python3 tools/package.py
      - run: python3 tools/audit-release.py --release
      - name: Save package and reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gnomenu-package
          path: |
            build/*.shell-extension.zip
            build/*.sha256
            reports/integration.json
            reports/i18n.json
            reports/release-readiness.json
