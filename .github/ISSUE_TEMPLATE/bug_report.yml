name: Bug report
description: Report a GnoMenu issue with a supported application or the panel.
body:
  - type: markdown
    attributes:
      value: Check docs/compatibility.md first. Partial menus expose only commands the application makes available.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: GNOME Shell version and distribution.
      placeholder: GNOME 50.6, Fedora 44
    validations:
      required: true
  - type: input
    id: application
    attributes:
      label: Application and package
      description: Application name/version and RPM, DEB, Flatpak or another package source.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and behavior
      description: Include expected and actual results, and whether multiple windows are involved.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or screenshots
      description: Optional. Remove private document names, paths and content before attaching them.
